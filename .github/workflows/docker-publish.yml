name: Docker Publish

on:
  schedule:
    - cron: '43 1 * * *'
  workflow_dispatch:
  push:
    branches: [ "master" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*' ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive image version
        id: version
        shell: bash
        run: |
          nginx_version="$(sed -nE 's/^FROM nginx:([0-9]+(\.[0-9]+){1,2})-alpine$/\1/p' Dockerfile)"
          if [ -z "${nginx_version}" ]; then
            echo "Failed to derive nginx version from Dockerfile" >&2
            exit 1
          fi
          echo "nginx_version=${nginx_version}" >> "${GITHUB_OUTPUT}"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.nginx_version }},enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=schedule,pattern=nightly
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.nginx_version }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

  heartbeat:
    if: >-
      ${{
        github.event_name == 'schedule' &&
        github.repository == 'ravmike/nginx-le' &&
        github.ref == 'refs/heads/master'
      }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: nginx-le-publish-heartbeat
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Commit heartbeat only when master is stale
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout --detach origin/master
          latest_commit_epoch="$(git show -s --format=%ct origin/master)"
          now_epoch="$(date -u +%s)"
          if (( now_epoch - latest_commit_epoch <= 40 * 24 * 60 * 60 )); then
            echo "Master was updated within the last 40 days; no heartbeat needed."
            exit 0
          fi

          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/publish-heartbeat
          git add -- .github/publish-heartbeat
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'ci: keep scheduled publish active'
          # A concurrent master push makes this fast-forward push fail safely;
          # the next scheduled run rechecks the current master commit date.
          git push origin HEAD:master
