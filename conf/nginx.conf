user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# quic_bpf on;

events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format apm '"$time_local" client=$remote_addr '
               'method=$request_method request="$request" '
               'request_length=$request_length '
               'status=$status bytes_sent=$bytes_sent '
               'body_bytes_sent=$body_bytes_sent '
               'referer=$http_referer '
               'user_agent="$http_user_agent" '
               'upstream_addr=$upstream_addr '
               'upstream_status=$upstream_status '
               'request_time=$request_time '
               'upstream_response_time=$upstream_response_time '
               'upstream_connect_time=$upstream_connect_time '
               'upstream_header_time=$upstream_header_time';

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    log_format custom '$remote_addr - $remote_user [$time_local] "$host" "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $upstream_response_time';

    log_format tls_observability escape=json
               '{"time":"$time_iso8601",'
               '"host":"$host",'
               '"server_name":"$server_name",'
               '"remote_addr":"$remote_addr",'
               '"status":$status,'
               '"request":"$request",'
               '"user_agent":"$http_user_agent",'
               '"ssl_protocol":"$ssl_protocol",'
               '"ssl_cipher":"$ssl_cipher",'
               '"ssl_curve":"$ssl_curve",'
               '"ssl_curves":"$ssl_curves",'
               '"ssl_ciphers":"$ssl_ciphers",'
               '"ssl_alpn_protocol":"$ssl_alpn_protocol",'
               '"ssl_session_reused":"$ssl_session_reused",'
               '"ssl_sigalg":"$ssl_sigalg",'
               '"ssl_client_sigalg":"$ssl_client_sigalg",'
               '"ssl_ech_status":"$ssl_ech_status",'
               '"ssl_ech_outer_server_name":"$ssl_ech_outer_server_name",'
               '"ssl_early_data":"$ssl_early_data"}';

    access_log  /var/log/nginx/access.log custom;
    access_log  /var/log/nginx/tls-observability.log tls_observability;

    # proxy_cache_key $scheme://$host$is_args$query_string$request_method;


    sendfile        on;

    keepalive_timeout  65;
    server_tokens off;

    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # --- Accept larger headers (cookies, SSO, proxies) ---
    client_header_buffer_size 16k;
    large_client_header_buffers 8 32k;
    max_headers 256;

    # --- Body limits: let apps decide (override per-vhost if you want) ---
    client_max_body_size 0;
    client_body_buffer_size 512k;

    # --- Proxy buffering (responses) baseline ---
    proxy_buffer_size 32k;
    proxy_buffers 32 32k;
    proxy_busy_buffers_size 512k;

    # Avoid huge proxy temp files on disk (prefer RAM; spill only if needed)
    proxy_temp_file_write_size 256k;
    proxy_max_temp_file_size 0;

    # --- Timeouts baseline (safe for media + long requests) ---
    proxy_connect_timeout 10s;
    proxy_send_timeout 1h;
    proxy_read_timeout 1h;
    send_timeout 1h;

    # --- WebSocket helper (used by Chatwoot/Vaultwarden, sometimes Immich) ---
    map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;

    ssl_stapling on;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling_verify on;
    ssl_ecdh_curve ?X25519MLKEM768:?SecP256r1MLKEM768/X25519:prime256v1:secp384r1;
    resolver 1.1.1.1;

    gzip on;
    gzip_types text/plain application/json text/css application/javascript application/x-javascript text/javascript text/xml application/xml application/rss+xml application/atom+xml application/rdf+xml;
    gzip_min_length 1000;
    gzip_proxied any;

    add_header_inherit merge;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "0";

    server {
        listen 80;
        server_name _;

        root   /usr/share/nginx/html;

        location /.well-known/ {}  # do not redirect requests letsencrypt

        location / {  # the default location redirects to https
            return 301 https://$host$request_uri;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}

stream {
    include /etc/nginx/stream.d/*.conf;
}
